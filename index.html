<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>词速 VocabSprint · 英语单词速通</title>
    <meta name="description" content="英语单词速通：四种题型、段次大测、离线可用。">
    <meta name="theme-color" content="#f3f2ee">
    <meta name="theme-color" content="#141620" media="(prefers-color-scheme: dark)">

    <!-- 添加到主屏幕（iOS） -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="词速">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <!-- 关键样式内联：即使旧 CSS 仍在缓存，树形菜单也不会在首屏自动展开 -->
    <style>#batchMenu[hidden],#modeMenu[hidden]{display:none!important}</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="icon-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16" opacity="0.45"/><path d="M7.5 20v-7"/><path d="M12 20V6"/><path d="M16.5 20v-10"/>
    </symbol>
    <symbol id="icon-export" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 14.5V4"/><path d="m8.2 7.5 3.8-3.8 3.8 3.8"/><path d="M4.5 14.5v2.7A2.8 2.8 0 0 0 7.3 20h9.4a2.8 2.8 0 0 0 2.8-2.8v-2.7"/>
    </symbol>
    <symbol id="icon-import" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v10.5"/><path d="m8.2 11 3.8 3.8 3.8-3.8"/><path d="M4.5 14.5v2.7A2.8 2.8 0 0 0 7.3 20h9.4a2.8 2.8 0 0 0 2.8-2.8v-2.7"/>
    </symbol>
    <symbol id="icon-csv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M13.5 3v5.5H19"/><path d="M12 11.5v5"/><path d="m9.8 14.3 2.2 2.2 2.2-2.2"/>
    </symbol>
    <symbol id="icon-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M9.4 9.4a2.7 2.7 0 1 1 3.9 2.4c-.8.4-1.3 1-1.3 1.9"/><path d="M12 16.6h0.01"/>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2.5 4.5 13.5h6L10 21.5l8.5-11h-6z"/>
    </symbol>
    <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
    </symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 5.5 6.5 9H3.5v6H6.5l4.5 3.5z"/><path d="M15.3 9a4.6 4.6 0 0 1 0 6"/><path d="M18 6.5a8.4 8.4 0 0 1 0 11"/>
    </symbol>
    <symbol id="icon-cut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2.8"/><circle cx="6" cy="18" r="2.8"/><path d="M20 4 8.2 15.8"/><path d="M14.6 14.6 20 20"/><path d="M8.2 8.2 12 12"/>
    </symbol>
    <symbol id="icon-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 5.5 8 11l5.5-5.5"/>
    </symbol>
</svg>
<div class="app-container" id="appContainer">
    <!-- 工具栏：左侧「视图 / 偏好 / 数据 / 帮助」分组，右侧主操作 -->
    <div class="toolbar">
        <div class="tool-group">
            <button class="btn-icon" id="btnFontMinus" aria-label="缩小字号">A-</button>
            <button class="btn-icon" id="btnFontPlus" aria-label="放大字号">A+</button>
            <button class="btn-icon" id="btnNightMode" aria-label="切换夜间模式">☾</button>
        </div>
        <div class="tool-group">
            <button class="btn-icon" id="btnAutoSpeak" title="自动发音开关">♪ Off</button>
            <button class="btn-icon" id="btnHideExamples" title="点击隐藏例句">例句</button>
        </div>
        <div class="tool-group">
            <button class="btn-icon" id="btnWrongBook" title="错题统计">
                <svg class="ic" aria-hidden="true"><use href="#icon-chart"></use></svg><span class="btn-label">错题统计</span>
            </button>
            <button class="btn-icon" id="btnExport" title="导出进度" aria-label="导出进度">
                <svg class="ic" aria-hidden="true"><use href="#icon-export"></use></svg><span class="btn-label">导出</span>
            </button>
            <button class="btn-icon" id="btnImport" title="导入进度" aria-label="导入进度">
                <svg class="ic" aria-hidden="true"><use href="#icon-import"></use></svg><span class="btn-label">导入</span>
            </button>
            <button class="btn-icon" id="btnImportCsv" title="导入CSV词汇">
                <svg class="ic" aria-hidden="true"><use href="#icon-csv"></use></svg><span class="btn-label">CSV</span>
            </button>
            <input type="file" id="importFile" accept=".json">
            <input type="file" id="importCsvFile" accept=".csv" multiple>
        </div>
        <div class="tool-group">
            <button class="btn-icon" id="btnHelp" aria-label="快捷键帮助" title="快捷键帮助">
                <svg class="ic" aria-hidden="true"><use href="#icon-help"></use></svg>
            </button>
        </div>
        <span class="spacer toolbar-spacer"></span>
        <div class="tool-group tool-group-primary">
            <button id="btnSpeedMode" class="btn-speed">
                <svg class="ic" aria-hidden="true"><use href="#icon-bolt"></use></svg><span class="btn-label">速通</span>
            </button>
            <button id="btnExitSpeed" style="display:none;">退出速通</button>
            <button id="btnBrowse" class="btn-browse">
                <svg class="ic" aria-hidden="true"><use href="#icon-book"></use></svg><span class="btn-label">浏览单词</span>
            </button>
            <span class="combo-wrap">
                <select id="directionSelect">
                    <option value="0">英文选中文</option>
                    <option value="1">中文选英文</option>
                    <option value="2">句子填空</option>
                    <option value="3">听音拼写</option>
                </select>
            </span>
        </div>
    </div>
    <div class="header-row" id="headerRow">
        <span class="title" id="titleLabel">词速 VocabSprint</span>
        <span class="combo-wrap batch-select-wrap" id="batchSelectWrap">
            <button type="button" class="batch-trigger" id="batchTrigger" aria-haspopup="tree" aria-expanded="false" aria-label="选择词汇范围">
                <span class="batch-value" id="batchTriggerLabel">全部</span>
            </button>
            <div class="batch-menu" id="batchMenu" role="tree" aria-label="词汇范围" hidden></div>
            <!-- 隐藏的原生 select 仍是数据/语义桥梁：JS 只改 value/disabled，自定义树形菜单负责展示 -->
            <select id="dateSelect" hidden>
                <option value="custom">自定义词汇</option>
            </select>
        </span>
        <span class="combo-wrap batch-select-wrap" id="modeSelectWrap">
            <button type="button" class="batch-trigger" id="modeTrigger" aria-haspopup="listbox" aria-expanded="false" aria-label="选择练习模式">
                <span class="batch-value" id="modeTriggerLabel">全部单词</span>
            </button>
            <div class="batch-menu mode-menu" id="modeMenu" role="listbox" aria-label="练习模式" hidden></div>
            <!-- 隐藏的原生 select 仍是数据/语义桥梁：JS 只改 value/disabled，弹层负责展示 -->
            <select id="modeSelect" hidden>
                <option value="0">全部单词</option>
                <option value="1">前一半</option>
                <option value="2">后一半</option>
                <option value="3">只复习错题</option>
                <option value="4">只复习难词</option>
                <option value="5">翻卡自测</option>
            </select>
        </span>
        <span class="stats" id="statsRow">
            <span class="score" id="scoreLabel">得分: 0/80</span>
            <span class="remaining" id="remainingLabel">剩余: 80</span>
            <span class="accuracy" id="accuracyLabel">正确率: 0%</span>
        </span>
    </div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="word-card" id="wordCard">
        <div class="top-actions" id="topActions">
            <button id="btnHardWord" aria-label="加入难词" title="难词">☆</button>
            <button id="btnSlashWord" aria-label="斩掉此词" title="斩词">
                <svg class="ic" aria-hidden="true"><use href="#icon-cut"></use></svg>
            </button>
        </div>
        <div class="word-display" id="wordDisplay"></div>
        <button id="btnSpeak" class="btn-icon" aria-label="播放发音" title="发音">
            <svg class="ic" aria-hidden="true"><use href="#icon-volume"></use></svg>
        </button>
        <div class="example-display" id="exampleDisplay"></div>
        <div class="example-cn-display" id="exampleCnDisplay"></div>
        <div class="stage-hint" id="stageHint">请选择中文解释:</div>
    </div>
    <div class="options-grid" id="optionsGrid">
        <button class="option-btn" data-index="0">-</button>
        <button class="option-btn" data-index="1">-</button>
        <button class="option-btn" data-index="2">-</button>
        <button class="option-btn" data-index="3">-</button>
    </div>
    <div class="input-mode-container" id="inputModeContainer">
        <input type="text" id="answerInput" placeholder="输入答案..." autocapitalize="off" autocomplete="off" spellcheck="false">
        <button id="btnSubmitAnswer">提交答案</button>
        <div id="inputFeedback"></div>
    </div>
    <div class="card-actions" id="cardActions">
        <button id="btnCardForgot" class="card-btn card-btn-wrong">✗ 还没记住</button>
        <button id="btnCardKnown" class="card-btn card-btn-right">✓ 记住了</button>
    </div>
    <div class="browse-container" id="browseContainer">
        <div class="browse-header">
            <h3 id="browseTitle">单词浏览</h3>
            <input type="text" id="browseSearch" placeholder="搜索单词或中文...">
            <button id="btnBackToTest" class="close-btn" style="margin:0;">返回测试</button>
        </div>
        <div id="browseList"></div>
    </div>
    <div class="bottom-bar" id="bottomBar">
        <span class="shortcut-hint" id="shortcutHint">快捷键: 1-4选答案 | Enter/空格 下一题 | ←上一题 | →返回 | A收藏 | S斩</span>
        <span id="timeLabel">学习时长: 0分钟</span>
        <span class="nav-btns" id="navBtns">
            <button id="btnPrev" disabled>上一题 (←)</button>
            <button id="btnReturn" disabled>返回 (→)</button>
        </span>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-dialog" id="modalDialog"></div></div>
<div id="toastContainer"></div>

<script src="script.js"></script>
</body>
</html>

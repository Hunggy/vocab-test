<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单词测试 · 多日期批次 (含速通模式)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container" id="appContainer">
    <div class="toolbar">
        <button class="btn-icon" id="btnFontMinus">A-</button>
        <button class="btn-icon" id="btnFontPlus">A+</button>
        <button class="btn-icon" id="btnNightMode">🌙</button>
        <button class="btn-icon" id="btnAutoSpeak" title="自动发音开关">🔊 Off</button>
        <button id="btnWrongBook">📊 错题统计</button>
        <button class="btn-icon" id="btnExport" title="导出进度">📤</button>
        <button class="btn-icon" id="btnImport" title="导入进度">📥</button>
        <input type="file" id="importFile" style="display:none" accept=".json">
        <button class="btn-icon" id="btnHelp">?</button>
        <span class="spacer"></span>
        <button id="btnSpeedMode" class="btn-speed">⚡ 速通</button>
        <button id="btnExitSpeed" style="display:none;background:#e74c3c;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:var(--font-small);">退出速通</button>
        <button id="btnBrowse" class="btn-browse">📖 浏览单词</button>
        <span class="combo-wrap">
            <select id="directionSelect">
                <option value="0">英文选中文</option>
                <option value="1">中文选英文</option>
                <option value="2">句子填空</option>
            </select>
        </span>
    </div>
    <div class="header-row" id="headerRow">
        <span class="title" id="titleLabel">📝 单词测试</span>
        <span class="combo-wrap">
            <select id="dateSelect">
                <option value="0509">5月9日 (81-120)</option>
                <option value="0516">5月16日 (121-160)</option>
                <option value="0523">5月23日 (161-200)</option>
                <option value="0530">5月30日 (201-240)</option>
                <option value="0606">6月6日 (241-280)</option>
                <option value="0620">6月20日 (281-320)</option>
                <option value="all">全部 (81-320)</option>
            </select>
            <select id="modeSelect">
                <option value="0">全部单词</option>
                <option value="1">前一半</option>
                <option value="2">后一半</option>
                <option value="3">只复习错题</option>
                <option value="4">只复习难词</option>
            </select>
        </span>
        <span class="stats" id="statsRow">
            <span class="score" id="scoreLabel">得分: 0/80</span>
            <span class="remaining" id="remainingLabel">剩余: 80</span>
            <span class="accuracy" id="accuracyLabel">正确率: 0%</span>
        </span>
    </div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="word-card" id="wordCard">
        <div class="top-actions" id="topActions">
            <button id="btnHardWord">⭐</button>
            <button id="btnSlashWord">🔪</button>
        </div>
        <div class="word-display" id="wordDisplay"></div>
        <button id="btnSpeak" class="btn-icon" style="border-radius:50%; width:40px; height:40px; margin: 0 auto 10px; display:block;" title="发音">🔊</button>
        <div class="example-display" id="exampleDisplay"></div>
        <div class="example-cn-display" id="exampleCnDisplay"></div>
        <div class="stage-hint" id="stageHint">请选择中文解释:</div>
    </div>
    <div class="options-grid" id="optionsGrid">
        <button class="option-btn" data-index="0">-</button>
        <button class="option-btn" data-index="1">-</button>
        <button class="option-btn" data-index="2">-</button>
        <button class="option-btn" data-index="3">-</button>
    </div>
    <div class="browse-container" id="browseContainer">
        <div class="browse-header">
            <h3 id="browseTitle">📖 单词浏览</h3>
            <input type="text" id="browseSearch" placeholder="搜索单词或中文..." style="padding:6px 10px; border-radius:6px; border:1px solid var(--border); background:var(--btn-bg); color:var(--fg); flex:1; max-width:200px; font-size:var(--font-small);">
            <button id="btnBackToTest" class="close-btn" style="margin:0;">返回测试</button>
        </div>
        <div id="browseList"></div>
    </div>
    <div class="bottom-bar" id="bottomBar">
        <span class="shortcut-hint" id="shortcutHint">快捷键: 1-4选答案 | Enter/空格 下一题 | ←上一题 | →返回 | A收藏 | S斩</span>
        <span id="timeLabel">学习时长: 0分钟</span>
        <span class="nav-btns" id="navBtns">
            <button id="btnPrev" disabled>上一题 (←)</button>
            <button id="btnReturn" disabled>返回 (→)</button>
        </span>
    </div>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-dialog" id="modalDialog"></div></div>
<div id="toastContainer" style="position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;"></div>

<script src="script.js"></script>
</body>
</html>
